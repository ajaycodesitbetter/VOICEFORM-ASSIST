
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceForm Assist | AI-Powered Accessible Automation</title>
    <meta name="description" content="Voice-guided form filling assistant for users with visual or motor impairments. Supports English and Hindi.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        yellow: {
                            400: '#FFE600',
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* High-contrast focus state for accessibility */
        :focus {
            outline: 6px solid #FFE600 !important;
            outline-offset: 4px;
        }

        /* Brutalist Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFE600;
            border: 3px solid #000000;
        }

        .brutalist-card {
            background: #18181b;
            border: 4px solid #FFE600;
            box-shadow: 12px 12px 0px #000000;
        }

        .brutalist-button {
            background: #FFE600;
            color: #000000;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px #27272a;
            transition: all 0.1s transform;
        }

        .brutalist-button:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px #27272a;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
